<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Concept art, sketches and artwork from Glacial Moon Games.">
    <title>Gallery | Glacial Moon Games</title>
    <link rel="icon" type="image/png" href="logoaba.png">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            min-height:100vh;
            overflow-x:hidden;
            background:#232323;
            color:#e6e6e6;
            font-family:Arial, Helvetica, sans-serif;
        }

        body:has(dialog[open]){
            overflow:hidden;
        }

        a{
            color:#fff;
            text-decoration:none;
        }

        a:hover{
            opacity:0.75;
        }

        header{
            padding:30px 24px 18px;
            text-align:center;
        }

        .logo{
            width:min(230px, 62vw);
            margin-bottom:14px;
        }

        h1{
            font-size:clamp(30px, 5vw, 48px);
            font-weight:300;
            letter-spacing:0.04em;
        }

        .intro{
            max-width:590px;
            margin:10px auto 0;
            color:#b8b8b8;
            line-height:1.6;
        }

        main{
            width:min(1240px, 100%);
            margin:0 auto;
            padding:2px 24px 40px;
        }

        .gallery-category{
            margin-top:42px;
            scroll-margin-top:20px;
        }

        .category-heading{
            margin-bottom:17px;
        }

        .category-heading h2{
            font-size:24px;
            font-weight:300;
        }

        .carousel-controls{
            display:none;
        }

        .carousel{
            display:flex;
            align-items:flex-end;
            gap:16px;
            overflow-x:auto;
            padding:0 0 14px;
            scroll-behavior:smooth;
            scroll-snap-type:x mandatory;
            scrollbar-color:#666 #303030;
            scrollbar-width:thin;
        }

        .gallery-item{
            flex:0 0 auto;
            scroll-snap-align:start;
            order:0;
            border:0;
            background:transparent;
            cursor:zoom-in;
            line-height:0;
        }

        .gallery-item.featured{
            order:-1;
        }

        .gallery-item img{
            display:block;
            width:auto;
            max-width:none;
            height:235px;
            border:0;
            object-fit:cover;
        }

        .gallery-item.featured img{
            height:360px;
        }

        .item-label{
            display:none;
        }

        .gallery-item:focus-visible{
            outline:2px solid #aaa;
            outline-offset:4px;
        }

        dialog{
            width:100vw;
            max-width:none;
            height:100vh;
            max-height:none;
            border:0;
            background:rgba(20, 20, 20, 0.96);
            color:#fff;
        }

        dialog::backdrop{
            background:rgba(0, 0, 0, 0.88);
        }

        .lightbox-layout{
            display:grid;
            grid-template-rows:auto minmax(0, 1fr);
            width:100%;
            height:100%;
            padding:18px;
        }

        .lightbox-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            width:min(1180px, 100%);
            margin:0 auto;
        }

        .lightbox-header{
            padding-bottom:14px;
        }

        .lightbox-title{
            display:none;
        }

        .lightbox-header{
            justify-content:flex-end;
        }

        .close-button{
            flex:0 0 auto;
            border:0;
            background:transparent;
            color:#fff;
            cursor:pointer;
            line-height:1;
        }

        .close-button{
            width:42px;
            height:42px;
            font-size:25px;
        }

        .lightbox-stage{
            overflow:auto;
            display:block;
            width:100%;
            height:100%;
            border-radius:10px;
            background:#171717;
        }

        .lightbox-image{
            display:block;
            width:auto;
            max-width:none;
            height:auto;
            max-height:none;
            margin:auto;
            cursor:zoom-out;
        }

        .lightbox-image.is-fitted{
            width:100%;
            height:100%;
            max-width:100%;
            max-height:100%;
            object-fit:contain;
            cursor:zoom-in;
        }

        .lightbox-nav{
            display:none;
            width:42px;
            height:42px;
            font-size:21px;
        }

        footer{
            margin-top:70px;
            padding:40px 20px;
            text-align:center;
            font-size:14px;
            opacity:0.6;
        }

        @media (max-width:600px){
            header{
                padding:28px 20px 16px;
            }

            .logo{
                width:180px;
            }

            main{
                padding-inline:16px;
            }

            .gallery-category{
                margin-top:32px;
            }

            .carousel{
                gap:12px;
            }

            .gallery-item img{
                height:210px;
            }

            .gallery-item.featured img{
                height:290px;
            }

            .lightbox-layout{
                padding:10px;
            }

        }

        @media (prefers-reduced-motion:reduce){
            html,
            .carousel{
                scroll-behavior:auto;
            }

            *{
                transition:none !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html"><img src="logo.png" class="logo" alt="Glacial Moon Games"></a>
        <h1>Gallery</h1>
        <p class="intro">Concept art, sketches and artwork from our games.</p>
    </header>

    <main>
        <section class="gallery-category" aria-labelledby="ellis-house-title">
            <div class="category-heading">
                <h2 id="ellis-house-title">Elli's House</h2>
                <div class="carousel-controls">
                    <button class="carousel-button" type="button" data-carousel="ellis-house" data-direction="-1" aria-label="Previous Elli's House images">‹</button>
                    <button class="carousel-button" type="button" data-carousel="ellis-house" data-direction="1" aria-label="Next Elli's House images">›</button>
                </div>
            </div>
            <div class="carousel" id="ellis-house">
                <button class="gallery-item featured" type="button" data-full="gallery/ellis-house/ellis-house-print.webp" data-title="Elli's House Print"><img src="gallery/ellis-house/ellis-house-print.webp" alt="Elli's House print artwork" loading="lazy" decoding="async"><span class="item-label">Elli's House Print <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/ellis-house/ellis-house-game-boy.webp" data-title="Game Boy Concept"><img src="gallery/ellis-house/ellis-house-game-boy.webp" alt="Elli's House Game Boy concept" loading="lazy" decoding="async"><span class="item-label">Game Boy Concept <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/ellis-house/elli-canon.webp" data-title="Elli"><img src="gallery/ellis-house/elli-canon.webp" alt="Elli character artwork" loading="lazy" decoding="async"><span class="item-label">Elli <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/ellis-house/ellis-house-advance.webp" data-title="Advance Concept"><img src="gallery/ellis-house/ellis-house-advance.webp" alt="Elli's House Advance concept" loading="lazy" decoding="async"><span class="item-label">Advance Concept <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/ellis-house/ellis-house-psp.webp" data-title="PSP Concept"><img src="gallery/ellis-house/ellis-house-psp.webp" alt="Elli's House PSP concept" loading="lazy" decoding="async"><span class="item-label">PSP Concept <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/ellis-house/ellis-house-mini.webp" data-title="Elli's House Mini"><img src="gallery/ellis-house/ellis-house-mini.webp" alt="Elli's House Mini artwork" loading="lazy" decoding="async"><span class="item-label">Elli's House Mini <span class="zoom-mark">⌕</span></span></button>
            </div>
        </section>

        <section class="gallery-category" aria-labelledby="insectorama-title">
            <div class="category-heading">
                <h2 id="insectorama-title">Insectorama</h2>
                <div class="carousel-controls">
                    <button class="carousel-button" type="button" data-carousel="insectorama" data-direction="-1" aria-label="Previous Insectorama images">‹</button>
                    <button class="carousel-button" type="button" data-carousel="insectorama" data-direction="1" aria-label="Next Insectorama images">›</button>
                </div>
            </div>
            <div class="carousel" id="insectorama">
                <button class="gallery-item featured" type="button" data-full="gallery/insectorama/banner.webp" data-title="Insectorama Banner"><img src="gallery/insectorama/banner.webp" alt="Insectorama banner artwork" loading="lazy" decoding="async"><span class="item-label">Insectorama Banner <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/insectorama/menus-concept.webp" data-title="Menu Concepts"><img src="gallery/insectorama/menus-concept.webp" alt="Insectorama menu concepts" loading="lazy" decoding="async"><span class="item-label">Menu Concepts <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/insectorama/tatu-jewel.webp" data-title="Tatu Jewel"><img src="gallery/insectorama/tatu-jewel.webp" alt="Tatu jewel concept" loading="lazy" decoding="async"><span class="item-label">Tatu Jewel <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/insectorama/tatu-tattoo.webp" data-title="Tatu Tattoo"><img src="gallery/insectorama/tatu-tattoo.webp" alt="Tatu tattoo concept" loading="lazy" decoding="async"><span class="item-label">Tatu Tattoo <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/insectorama/tatu-concept.webp" data-title="Tatu Concept"><img src="gallery/insectorama/tatu-concept.webp" alt="Tatu character concept" loading="lazy" decoding="async"><span class="item-label">Tatu Concept <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/insectorama/tatus.webp" data-title="Tatus"><img src="gallery/insectorama/tatus.webp" alt="Tatus character lineup" loading="lazy" decoding="async"><span class="item-label">Tatus <span class="zoom-mark">⌕</span></span></button>
            </div>
        </section>

        <section class="gallery-category" aria-labelledby="tori-title">
            <div class="category-heading">
                <h2 id="tori-title">Tori</h2>
                <div class="carousel-controls">
                    <button class="carousel-button" type="button" data-carousel="tori" data-direction="-1" aria-label="Previous Tori images">‹</button>
                    <button class="carousel-button" type="button" data-carousel="tori" data-direction="1" aria-label="Next Tori images">›</button>
                </div>
            </div>
            <div class="carousel" id="tori">
                <button class="gallery-item" type="button" data-full="gallery/tori/sisters.webp" data-title="Sisters"><img src="gallery/tori/sisters.webp" alt="Tori sisters artwork" loading="lazy" decoding="async"><span class="item-label">Sisters <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item featured" type="button" data-full="gallery/tori/psp-wallpaper.webp" data-title="PSP Wallpaper"><img src="gallery/tori/psp-wallpaper.webp" alt="Tori PSP wallpaper" loading="lazy" decoding="async"><span class="item-label">PSP Wallpaper <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/tori/sketches.webp" data-title="Sketches"><img src="gallery/tori/sketches.webp" alt="Tori sketches" loading="lazy" decoding="async"><span class="item-label">Sketches <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/tori/tori-concept.webp" data-title="Tori Concept"><img src="gallery/tori/tori-concept.webp" alt="Tori character concept" loading="lazy" decoding="async"><span class="item-label">Tori Concept <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/tori/tori-and-elli.webp" data-title="Tori & Elli"><img src="gallery/tori/tori-and-elli.webp" alt="Tori and Elli artwork" loading="lazy" decoding="async"><span class="item-label">Tori &amp; Elli <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/tori/tori-and-nico.webp" data-title="Tori & Nico"><img src="gallery/tori/tori-and-nico.webp" alt="Tori and Nico artwork" loading="lazy" decoding="async"><span class="item-label">Tori &amp; Nico <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/tori/tori-final.webp" data-title="Tori Final"><img src="gallery/tori/tori-final.webp" alt="Final Tori character artwork" loading="lazy" decoding="async"><span class="item-label">Tori Final <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/tori/tori-marcy.webp" data-title="Tori Marcy"><img src="gallery/tori/tori-marcy.webp" alt="Tori Marcy artwork" loading="lazy" decoding="async"><span class="item-label">Tori Marcy <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/tori/scary-tori.webp" data-title="Scary Tori"><img src="gallery/tori/scary-tori.webp" alt="Scary Tori artwork" loading="lazy" decoding="async"><span class="item-label">Scary Tori <span class="zoom-mark">⌕</span></span></button>
            </div>
        </section>

        <section class="gallery-category" aria-labelledby="misc-title">
            <div class="category-heading">
                <h2 id="misc-title">Misc</h2>
                <div class="carousel-controls">
                    <button class="carousel-button" type="button" data-carousel="misc" data-direction="-1" aria-label="Previous miscellaneous images">‹</button>
                    <button class="carousel-button" type="button" data-carousel="misc" data-direction="1" aria-label="Next miscellaneous images">›</button>
                </div>
            </div>
            <div class="carousel" id="misc">
                <button class="gallery-item" type="button" data-full="gallery/misc/card-game-field.webp" data-title="Card Game Field"><img src="gallery/misc/card-game-field.webp" alt="Card game field concept" loading="lazy" decoding="async"><span class="item-label">Card Game Field <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item featured" type="button" data-full="gallery/misc/glacial-moon-mug.webp" data-title="Glacial Moon Mug"><img src="gallery/misc/glacial-moon-mug.webp" alt="Glacial Moon Games mug" loading="lazy" decoding="async"><span class="item-label">Glacial Moon Mug <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/misc/monkeys.webp" data-title="Monkeys"><img src="gallery/misc/monkeys.webp" alt="Monkey character artwork" loading="lazy" decoding="async"><span class="item-label">Monkeys <span class="zoom-mark">⌕</span></span></button>
                <button class="gallery-item" type="button" data-full="gallery/misc/social-art.webp" data-title="Glacial Moon Artwork"><img src="gallery/misc/social-art.webp" alt="Glacial Moon Games artwork" loading="lazy" decoding="async"><span class="item-label">Glacial Moon Artwork <span class="zoom-mark">⌕</span></span></button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Glacial Moon Games</p>
    </footer>

    <dialog id="lightbox" aria-labelledby="lightbox-title">
        <div class="lightbox-layout">
            <div class="lightbox-header">
                <h2 class="lightbox-title" id="lightbox-title"></h2>
                <button class="close-button" type="button" aria-label="Close full-size image">×</button>
            </div>
            <div class="lightbox-stage">
                <img class="lightbox-image is-fitted" src="" alt="" role="button" tabindex="0" aria-label="Toggle original image size">
            </div>
        </div>
    </dialog>

    <!-- Gallery published through the Glacial Moon Games repository. -->
    <script>
        const preferredLanguage = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';

        if (/^pt(?:-|$)/i.test(preferredLanguage)) {
            document.documentElement.lang = 'pt-BR';
            document.title = 'Galeria | Glacial Moon Games';
            document.querySelector('h1').textContent = 'Galeria';
            document.querySelector('.intro').textContent = 'Artes conceituais, rascunhos e ilustrações dos nossos jogos.';
            document.querySelector('#misc-title').textContent = 'Diversos';
            document.querySelector('.lightbox-image').setAttribute('aria-label', 'Alternar tamanho original da imagem');
        }

        const items = [...document.querySelectorAll('.gallery-item')];
        const lightbox = document.querySelector('#lightbox');
        const lightboxImage = lightbox.querySelector('.lightbox-image');
        const lightboxTitle = lightbox.querySelector('.lightbox-title');
        const lightboxStage = lightbox.querySelector('.lightbox-stage');
        let currentIndex = 0;

        document.querySelectorAll('.carousel-button').forEach((button) => {
            button.addEventListener('click', () => {
                const carousel = document.getElementById(button.dataset.carousel);
                carousel.scrollBy({
                    left: carousel.clientWidth * 0.8 * Number(button.dataset.direction),
                    behavior: 'smooth'
                });
            });
        });

        function showImage(index) {
            currentIndex = (index + items.length) % items.length;
            const item = items[currentIndex];
            const source = item.dataset.full;
            const title = item.dataset.title;

            lightboxImage.src = source;
            lightboxImage.alt = item.querySelector('img').alt;
            lightboxImage.classList.add('is-fitted');
            lightboxTitle.textContent = title;
            lightboxStage.scrollTo({ top: 0, left: 0 });
        }

        function toggleImageSize() {
            lightboxImage.classList.toggle('is-fitted');
            lightboxStage.scrollTo({ top: 0, left: 0 });
        }

        items.forEach((item, index) => {
            item.addEventListener('click', () => {
                showImage(index);
                lightbox.showModal();
            });
        });

        lightbox.querySelector('.close-button').addEventListener('click', () => lightbox.close());
        lightboxImage.addEventListener('click', toggleImageSize);
        lightboxImage.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleImageSize();
            }
        });
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) lightbox.close();
        });

        document.addEventListener('keydown', (event) => {
            if (!lightbox.open) return;
            if (event.key === 'ArrowLeft') showImage(currentIndex - 1);
            if (event.key === 'ArrowRight') showImage(currentIndex + 1);
        });
    </script>
</body>
</html>
