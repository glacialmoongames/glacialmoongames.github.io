<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#232323">
  <title>Portfólio — Glacial Moon Games</title>
  <link rel="icon" type="image/png" href="logoaba.png">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:#232323;color:#e6e6e6;font-family:Arial,Helvetica,sans-serif;text-align:center}
    header{padding:80px 20px 34px}
    .logo{display:block;width:440px;max-width:calc(100vw - 40px);height:auto;margin:0 auto}
    main{width:min(1160px,calc(100% - 40px));margin:0 auto 50px}
    h1{margin:0 0 28px;font-size:28px;font-weight:700}
    #composition{position:relative;width:100%;aspect-ratio:3/2}
    .piece{position:absolute;left:var(--x);top:var(--y);width:var(--w);z-index:var(--z);transform:translate(-50%,-50%)}
    .piece img{display:block;width:100%;height:auto;border-radius:7px}
    .piece.text{color:#e6e6e6;font-size:clamp(15px,2.1vw,30px);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:600px){header{padding:60px 20px 28px}.logo{width:220px}main{width:calc(100% - 28px)}h1{margin-bottom:22px;font-size:26px}}
  </style>
</head>
<body>
  <header><img class="logo" src="logo.png" alt="Glacial Moon Games"></header>
  <main>
    <h1>Portfólio</h1>
    <section id="composition" aria-label="Portfólio"></section>
  </main>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const client=createClient('https://sdchkvhzzcmpyszqtxlw.supabase.co','sb_publishable_hlQm6wS9WnADEVupUCqQ8Q_ulClFteW');
    const stage=document.getElementById('composition');
    const {data}=await client.from('studio_canvas').select('elements').eq('id',1).maybeSingle();
    for(const item of (Array.isArray(data?.elements)?data.elements:[])){
      const piece=document.createElement('div');
      piece.className='piece'+(item.type==='text'?' text':'');
      piece.style.setProperty('--x',item.x+'%');
      piece.style.setProperty('--y',item.y+'%');
      piece.style.setProperty('--w',item.w+'%');
      piece.style.setProperty('--z',item.z);
      if(item.type==='image'){
        const img=document.createElement('img');
        img.src=item.src;
        img.alt=item.alt||'';
        img.loading='lazy';
        img.decoding='async';
        piece.append(img);
      }else if(item.type==='text'){
        piece.textContent=item.text||'';
      }
      stage.append(piece);
    }
  </script>
</body>
</html>
