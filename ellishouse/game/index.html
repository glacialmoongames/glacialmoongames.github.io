<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,viewport-fit=cover"name=viewport><title>Elli's House</title><style>body,html{width:100%;height:100%;margin:0;background:#000;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,calc(100vh * 1.76147));height:min(100vh,calc(100vw / 1.76147));image-rendering:pixelated;outline:0}#status{position:fixed;inset:auto 0 18px;text-align:center;color:#eee;font:14px Arial,sans-serif}</style></head><body><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><div id=status>Loading Elli's House…</div><script>var Module={canvas:document.getElementById("canvas"),setStatus:function(t){var e=document.getElementById("status");e.textContent=t||"",e.hidden=!t}};addEventListener("click",(function(){Module.canvas.focus()}),{once:!0})</script><script async src=ellis_house.js></script></body></html>
