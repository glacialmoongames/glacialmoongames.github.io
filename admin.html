<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#232323">
  <title>Administração do Portfólio — Glacial Moon Games</title>
  <link rel="icon" type="image/png" href="logoaba.png">
  <style>
    :root{color-scheme:dark;--bg:#232323;--ink:#e6e6e6;--muted:#aaa;--accent:#f47b20;--line:#4a4a4a}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}
    body{background:var(--bg);color:var(--ink);font:16px Arial,Helvetica,sans-serif;text-align:center}
    header{padding:34px 20px 26px}
    .masthead{display:flex;align-items:center;justify-content:center;gap:20px;width:max-content;max-width:100%;margin:0 auto}
    .logo{display:block;width:170px;max-width:48vw;height:auto}
    h1{margin:0;font-size:28px;font-weight:700;white-space:nowrap}
    main{width:min(1160px,calc(100% - 40px));margin:0 auto 48px}
    .canvas-tabs{position:sticky;top:8px;z-index:900;display:flex;justify-content:center;gap:0;flex-wrap:wrap;margin:0 auto 16px;padding:8px 0;background:linear-gradient(var(--bg) 78%,rgba(35,35,35,0));}
    .canvas-tabs button{min-width:0;padding:8px 16px;border:0;border-radius:0;background:transparent;color:var(--muted);letter-spacing:.08em}
    .canvas-tabs button:hover{border-color:transparent;background:transparent;color:var(--ink)}
    .canvas-tabs button+button{border-left:1px solid #666}
    .canvas-tabs button.active{color:var(--accent);font-weight:700}
    .toolbar,.login-row{display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;margin:0 auto 14px}
    .toolbar.visible,.login-row.visible{display:flex}
    button,.button{appearance:none;border:1px solid var(--line);border-radius:8px;background:#303030;color:var(--ink);padding:8px 11px;font:inherit;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s}
    button:hover,.button:hover{background:#393939;border-color:#696969}
    button.primary{background:var(--accent);border-color:var(--accent);color:#171717;font-weight:700}
    button.primary:hover{background:#ff9140}
    button:disabled{opacity:.42;cursor:default}
    input[type=email]{width:min(290px,62vw);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#1d1d1d;color:var(--ink);font:inherit}
    input[type=file]{display:none}
    #status{min-height:18px;color:var(--muted);font-size:12px;margin:0 0 10px}
    .login-row{margin-bottom:8px}
    #composition{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;column-gap:16px;row-gap:28px;width:100%;height:auto!important;min-height:calc(var(--canvas-min-height,0px) + var(--canvas-extra-space,0px));padding-bottom:var(--canvas-extra-space,0px);aspect-ratio:auto;touch-action:none;container-type:inline-size}
    #composition.icons-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    #composition.single-column{grid-template-columns:1fr}
    #composition.characters-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    #composition.single-column .piece:not(.text){aspect-ratio:auto;display:block}
    #composition.single-column .piece:not(.text) img{height:auto}
    #composition.editor-grid{background-image:radial-gradient(circle,rgba(230,230,230,.2) 1px,transparent 1.4px);background-size:16px 16px;background-position:0 0}
    #composition.drop-active::after{content:'Solte para adicionar';position:absolute;inset:0;z-index:100;display:grid;place-items:center;border:1px dashed var(--accent);border-radius:10px;background:rgba(35,35,35,.88);color:var(--ink);font-size:clamp(18px,3vw,28px);pointer-events:none}
    .piece{position:absolute;left:var(--x);top:var(--y);width:var(--w);z-index:var(--z);transform:translate(-50%,-50%);user-select:none}
    #composition .piece:not(.text){position:relative;left:auto;top:auto;width:100%;transform:none!important;aspect-ratio:1/1;display:grid;place-items:center;align-self:start;cursor:grab}
    #composition .piece:not(.text):active{cursor:grabbing}
    #composition .piece:not(.text) img{width:100%;height:100%;object-fit:contain}
    #composition .piece.dragging{opacity:.4}
    #composition .piece.drop-target{outline:2px solid var(--accent);outline-offset:3px}
    #composition .piece.text{position:relative;left:auto;top:auto;width:var(--w);transform:none;grid-column:1/-1;justify-self:start;cursor:grab}
    #composition .piece.text:active{cursor:grabbing}
    .piece img{display:block;width:100%;height:auto;border-radius:7px;pointer-events:none;user-select:none}
    .piece.text{color:#e6e6e6;font-family:Arial,Helvetica,sans-serif;font-size:clamp(12px,calc(var(--font-scale,2.1)*1cqw),100px);line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
    .text-content{display:block;width:100%;min-height:1em;white-space:pre-wrap;user-select:text}
    .text-content[contenteditable=true]{outline:1px dashed var(--accent);outline-offset:3px;cursor:text}
    .piece.selected{outline:1px dashed var(--accent);outline-offset:4px}
    .selection-box{position:absolute;z-index:1000;border:0;background:rgba(244,123,32,.12);pointer-events:none}
    .selection-box[hidden]{display:none}
    .resize-handle{display:none;position:absolute;width:14px;height:14px;right:-7px;bottom:-7px;border:2px solid var(--bg);border-radius:50%;background:var(--accent);cursor:nwse-resize;touch-action:none}
    .piece.selected .resize-handle{display:block}
    .width-handle{display:none;position:absolute;width:14px;height:14px;right:-7px;top:calc(50% - 7px);border:2px solid var(--bg);border-radius:50%;background:var(--accent);cursor:ew-resize;touch-action:none}
    .piece.selected .width-handle{display:block}
    .lightbox{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.92);cursor:zoom-out}
    .lightbox[hidden]{display:none}.lightbox img{display:block;max-width:min(96vw,1800px);max-height:94vh;width:auto;height:auto;object-fit:contain;border-radius:7px;cursor:default}
    #hint{color:#777;font-size:12px;margin:8px auto 0}
    @media(max-width:700px){header{padding:27px 14px 22px}.masthead{gap:12px}.logo{width:110px}h1{font-size:24px}main{width:calc(100% - 28px)}.toolbar,.login-row{gap:6px;margin-bottom:12px}button,.button{padding:8px 9px;font-size:12px}.canvas-tabs{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.canvas-tabs::-webkit-scrollbar{display:none}.canvas-tabs button{flex:0 0 auto;padding:8px 12px;white-space:nowrap}input[type=email]{width:min(250px,60vw)}}
  </style>
</head>
<body>
  <header><div class="masthead"><img class="logo" src="logo.png" alt="Glacial Moon Games"><h1>Portfólio</h1></div></header>
  <main>
    <nav id="canvas-tabs" class="canvas-tabs" aria-label="Portfólios">
      <button type="button" class="canvas-tab active" data-canvas-id="1" data-tab-en="ICON'S/EMOTES" data-tab-pt="ICON'S/EMOTES" aria-pressed="true">ICON'S/EMOTES</button>
      <button type="button" class="canvas-tab" data-canvas-id="3" data-tab-en="BODY" data-tab-pt="CORPO" aria-pressed="false">BODY</button>
      <button type="button" class="canvas-tab" data-canvas-id="4" data-tab-en="FULL ART" data-tab-pt="ARTE COMPLETA" aria-pressed="false">FULL ART</button>
      <button type="button" class="canvas-tab" data-canvas-id="5" data-tab-en="CHARACTER SHEETS" data-tab-pt="FICHAS DE PERSONAGEM" aria-pressed="false">CHARACTER SHEETS</button>
      <button type="button" class="canvas-tab" data-canvas-id="2" data-tab-en="CHARACTERS" data-tab-pt="PERSONAGENS" aria-pressed="false">PERSONAGENS</button>
    </nav>
    <div id="login" class="login-row">
      <input id="email" type="email" autocomplete="email" placeholder="E-mail de administrador" aria-label="E-mail">
      <button id="signin" class="primary">Entrar</button>
    </div>
    <nav id="toolbar" class="toolbar" aria-label="Ferramentas de edição">
      <label class="button" for="image-input">+ Imagens</label><input id="image-input" type="file" accept="image/*" multiple>
      <button id="add-text">+ Texto</button><button id="add-space">+ Espaço</button><button id="edit-text" disabled>Editar texto</button><button id="view-image" disabled>Ver imagem</button>
      <button id="front" disabled>Trazer à frente</button><button id="backward" disabled>Enviar atrás</button><button id="delete" disabled>Remover</button>
      <button id="save" class="primary" disabled>Salvar</button><button id="signout">Sair</button>
    </nav>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="composition" class="icons-grid" aria-label="Prévia do portfólio"></section>
    <p id="hint">Entre para editar. Arraste elementos; Shift+clique seleciona vários. Arraste a alça para redimensionar e use “Ver imagem” para abrir uma imagem inteira.</p>
  </main>
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Imagem em tamanho cheio" hidden><img id="lightbox-image" alt="" draggable="true"></div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.119.0';
    const SUPABASE_URL='https://sdchkvhzzcmpyszqtxlw.supabase.co';
    const SUPABASE_KEY='sb_publishable_hlQm6wS9WnADEVupUCqQ8Q_ulClFteW';
    const OWNER_EMAIL='glacialmoongames@gmail.com';
    const BUCKET='studio-art';
    const client=createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=selector=>document.querySelector(selector);
    const preferredLanguage=(navigator.languages&&navigator.languages[0])||navigator.language||'en';
    const usePortuguese=/^pt(?:-|$)/i.test(preferredLanguage);
    document.documentElement.lang=usePortuguese?'pt-BR':'en';
    for(const tab of document.querySelectorAll('[data-tab-en]'))tab.textContent=usePortuguese?tab.dataset.tabPt:tab.dataset.tabEn;
    const stage=$('#composition'),status=$('#status'),toolbar=$('#toolbar'),login=$('#login');
    const selectionBox=document.createElement('div');selectionBox.className='selection-box';selectionBox.hidden=true;
    const lightbox=$('#lightbox'),lightboxImage=$('#lightbox-image');
    let elements=[],selectedIds=new Set(),nodes=new Map(),user=null,dirty=false,extraSpace=0,copiedTextBoxes=[],canvasId=1;
    let overlapCycle={x:NaN,y:NaN,index:0,ids:[]};
    const say=message=>{status.textContent=message};
    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));

    function closeLightbox(){lightbox.hidden=true;lightboxImage.removeAttribute('src');document.body.style.overflow=''}
    function openLightbox(item){lightboxImage.src=item.src;lightboxImage.alt=item.alt||'';lightboxImage.draggable=true;lightbox.hidden=false;document.body.style.overflow='hidden'}
    lightbox.addEventListener('click',event=>{if(event.target===lightbox)closeLightbox()});
    window.addEventListener('keydown',event=>{
      if(event.key!=='Escape')return;
      if(!lightbox.hidden){closeLightbox();return}
      const active=document.activeElement;
      if(active?.matches('.text-content[contenteditable="true"]'))active.blur();
      if(selectedIds.size){selectedIds.clear();syncSelection();event.preventDefault()}
    });

    function syncSelection(){
      for(const [id,node] of nodes)node.classList.toggle('selected',selectedIds.has(id));
      syncButtons();
    }
    function syncButtons(){
      const chosen=elements.filter(item=>selectedIds.has(item.id));
      $('#delete').disabled=chosen.length===0;
      $('#front').disabled=chosen.length===0;
      $('#backward').disabled=chosen.length===0;
      $('#edit-text').disabled=chosen.length!==1||chosen[0]?.type!=='text';
      $('#view-image').disabled=chosen.length!==1||chosen[0]?.type!=='image';
      $('#save').disabled=!user||!dirty;
    }
    function stylePiece(node,item){
      node.style.setProperty('--x',item.x+'%');
      node.style.setProperty('--y',item.y+'%');
      node.style.setProperty('--w',item.w+'%');
      node.style.setProperty('--font-scale',Number.isFinite(item.fontSize)?item.fontSize/11.6:(item.fontScale||2.1));
      node.style.setProperty('--z',item.z);
      node.style.transform='translate(-50%,-50%)';
    }
    function createPiece(item){
      const node=document.createElement('div');
      node.className='piece'+(item.type==='text'?' text':'');
      node.dataset.id=item.id;
      stylePiece(node,item);
      if(item.type==='image'){
        const img=document.createElement('img');
        img.src=item.previewSrc||item.src;img.alt=item.alt||'';img.loading='lazy';img.decoding='async';img.fetchPriority='low';img.draggable=false;
        node.append(img);
      }else{
        const content=document.createElement('span');content.className='text-content';content.textContent=item.text||'';node.append(content);
        content.addEventListener('blur',()=>{
          if(content.contentEditable!=='true')return;
          const updated=(content.innerText||'').replace(/\r/g,'').replace(/\n$/,'');
          content.contentEditable='false';content.textContent=updated;
          if(updated!==item.text){item.text=updated;setDirty('Texto atualizado. Salve para publicar.')}
        });
        node.addEventListener('dblclick',event=>{event.preventDefault();event.stopPropagation();beginTextEdit(item,node)});
      }
      if(item.type==='text'){
        const handle=document.createElement('span');handle.className='resize-handle';handle.setAttribute('aria-hidden','true');node.append(handle);
        const widthHandle=document.createElement('span');widthHandle.className='width-handle';widthHandle.setAttribute('aria-hidden','true');node.append(widthHandle);
      }
      node.addEventListener('pointerdown',event=>startPointer(event,item,node));
      nodes.set(item.id,node);
      return node;
    }
    function beginTextEdit(item,node){
      if(!user||item.type!=='text')return;
      selectedIds=new Set([item.id]);syncSelection();
      const content=node.querySelector('.text-content');content.contentEditable='true';content.focus();
      const range=document.createRange();range.selectNodeContents(content);range.collapse(false);
      const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
    }
    function updateStageHeight(){const base=stage.clientWidth*2/3,extra=extraSpace*(stage.clientWidth/1160);stage.style.setProperty('--canvas-min-height',base+'px');stage.style.setProperty('--canvas-extra-space',extra+'px');stage.style.height=(base+extra)+'px'}
    new ResizeObserver(updateStageHeight).observe(stage);
    function render(){
      nodes.clear();stage.replaceChildren();updateStageHeight();
      for(const item of elements)stage.append(createPiece(item));
      stage.append(selectionBox);
      syncSelection();
    }
    function setDirty(message){
      dirty=true;syncButtons();if(message)say(message);
    }
    function highestLayer(){return elements.reduce((highest,item)=>Math.max(highest,Number.isFinite(Number(item.z))?Number(item.z):0),0)}
    function startPointer(event,item,node){
      if(!user)return;
      if(node.querySelector('.text-content')?.isContentEditable&&event.target.closest('.text-content'))return;
      if(item.type==='text'&&event.target===node.querySelector('.width-handle')){
        event.preventDefault();event.stopPropagation();selectedIds=new Set([item.id]);syncSelection();
        startTextWidthResize(event,item,node);return;
      }
      if(event.target===node.querySelector('.resize-handle')){
        event.preventDefault();event.stopPropagation();
        if(!selectedIds.has(item.id)||selectedIds.size<2)selectedIds=new Set([item.id]);
        syncSelection();
        startResize(event,item,node);return;
      }
      const hitIds=elements
        .filter(entry=>{
          const rect=nodes.get(entry.id)?.getBoundingClientRect();
          return rect&&event.clientX>=rect.left&&event.clientX<=rect.right&&event.clientY>=rect.top&&event.clientY<=rect.bottom;
        })
        .sort((a,b)=>a.z-b.z)
        .map(entry=>entry.id);
      if(hitIds.length>1){
        const sameSpot=Math.abs(event.clientX-overlapCycle.x)<5&&Math.abs(event.clientY-overlapCycle.y)<5&&hitIds.join('|')===overlapCycle.ids.join('|');
        overlapCycle={x:event.clientX,y:event.clientY,index:sameSpot?(overlapCycle.index+1)%hitIds.length:0,ids:hitIds};
        const targetId=hitIds[hitIds.length-1-overlapCycle.index];
        item=elements.find(entry=>entry.id===targetId)||item;
        node=nodes.get(item.id)||node;
      }else{
        overlapCycle={x:NaN,y:NaN,index:0,ids:[]};
      }
      const multi=event.shiftKey||event.ctrlKey||event.metaKey;
      if(multi){
        if(selectedIds.has(item.id)){selectedIds.delete(item.id);syncSelection();return}
        selectedIds.add(item.id);
      }else if(!selectedIds.has(item.id)){
        selectedIds=new Set([item.id]);
      }
      if(!selectedIds.has(item.id))return;
      event.preventDefault();syncSelection();
      if(item.type==='image'||item.type==='text'){startGridReorder(event,item,node);return}
      const moving=elements.filter(entry=>selectedIds.has(entry.id));
      const startX=event.clientX,startY=event.clientY,rect=stage.getBoundingClientRect();
      const startPositions=moving.map(entry=>{
        const bounds=nodes.get(entry.id)?.getBoundingClientRect();
        return {item:entry,node:nodes.get(entry.id),x:entry.x,y:entry.y,width:bounds?.width||0,height:bounds?.height||0};
      });
      const gridSize=16,finalPositions=new Map();
      let raf=0,lastX=startX,lastY=startY,lastFreeMove=false;
      const draw=(clientX,clientY,freeMove=false)=>{
        const dx=clientX-startX,dy=clientY-startY;
        for(const entry of startPositions){
          const rawLeft=entry.x/100*rect.width-entry.width/2+dx;
          const rawTop=entry.y/100*rect.height-entry.height/2+dy;
          const left=clamp(freeMove?rawLeft:Math.round(rawLeft/gridSize)*gridSize,0,Math.max(0,rect.width-entry.width));
          const top=clamp(freeMove?rawTop:Math.round(rawTop/gridSize)*gridSize,0,Math.max(0,rect.height-entry.height));
          const x=(left+entry.width/2)/rect.width*100,y=(top+entry.height/2)/rect.height*100;
          finalPositions.set(entry.item.id,{x,y});
          if(entry.node)entry.node.style.transform='translate3d(calc(-50% + '+(x-entry.x)/100*rect.width+'px),calc(-50% + '+(y-entry.y)/100*rect.height+'px),0)';
        }
      };
      const move=nextEvent=>{
        lastX=nextEvent.clientX;lastY=nextEvent.clientY;lastFreeMove=nextEvent.ctrlKey;
        if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw(lastX,lastY,lastFreeMove)});
      };
      const finish=nextEvent=>{
        window.removeEventListener('pointermove',move);
        window.removeEventListener('pointerup',finish);
        window.removeEventListener('pointercancel',finish);
        if(raf){cancelAnimationFrame(raf);raf=0}
        draw(nextEvent.clientX,nextEvent.clientY,nextEvent.ctrlKey);
        let changed=false;
        for(const entry of startPositions){
          const final=finalPositions.get(entry.item.id)||{x:entry.x,y:entry.y};
          if(Math.abs(final.x-entry.x)>.001||Math.abs(final.y-entry.y)>.001)changed=true;
          entry.item.x=final.x;entry.item.y=final.y;
          if(entry.node)stylePiece(entry.node,entry.item);
        }
        if(changed)setDirty('Posição atualizada. Salve para publicar.');
      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',finish,{once:true});
      window.addEventListener('pointercancel',finish,{once:true});
    }
    function startGridReorder(event,item,node){
      const startX=event.clientX,startY=event.clientY;
      let dragging=false,targetItem=null;
      const clearTargets=()=>{for(const candidate of elements)nodes.get(candidate.id)?.classList.remove('drop-target')};
      const move=nextEvent=>{
        if(!dragging&&Math.hypot(nextEvent.clientX-startX,nextEvent.clientY-startY)<6)return;
        dragging=true;node.classList.add('dragging');
        clearTargets();targetItem=elements.find(candidate=>{
          if(candidate.id===item.id||!['image','text'].includes(candidate.type))return false;
          const bounds=nodes.get(candidate.id)?.getBoundingClientRect();
          return bounds&&nextEvent.clientX>=bounds.left&&nextEvent.clientX<=bounds.right&&nextEvent.clientY>=bounds.top&&nextEvent.clientY<=bounds.bottom;
        })||null;
        if(targetItem)nodes.get(targetItem.id)?.classList.add('drop-target');
      };
      const cleanup=()=>{
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel);
        node.classList.remove('dragging');clearTargets();
      };
      const cancel=()=>cleanup();
      const finish=nextEvent=>{
        cleanup();
        if(!dragging)return;
        const oldIndex=elements.indexOf(item);
        elements.splice(oldIndex,1);
        if(targetItem){
          const targetNode=nodes.get(targetItem.id),bounds=targetNode?.getBoundingClientRect();
          let insertAt=elements.indexOf(targetItem);
          if(bounds&&(nextEvent.clientY>bounds.top+bounds.height/2||(Math.abs(nextEvent.clientY-(bounds.top+bounds.height/2))<bounds.height/2&&nextEvent.clientX>bounds.left+bounds.width/2)))insertAt++;
          elements.splice(clamp(insertAt,0,elements.length),0,item);
        }else{
          elements.push(item);
        }
        const newIndex=elements.indexOf(item);
        if(newIndex===oldIndex)return;
        elements.forEach((entry,index)=>{entry.gridOrder=index});
        selectedIds=new Set([item.id]);render();setDirty('Imagem reposicionada. Salve para publicar.');
      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',finish,{once:true});
      window.addEventListener('pointercancel',cancel,{once:true});
    }
    function startResize(event,item,node){
      const startX=event.clientX,rect=stage.getBoundingClientRect(),isText=item.type==='text',gridSize=16;
      const targets=isText?[item]:elements.filter(entry=>selectedIds.has(entry.id)&&entry.type==='image');
      const resizingGroup=!isText&&targets.length>1;
      const entries=targets.map(target=>{
        const bounds=nodes.get(target.id).getBoundingClientRect();
        return {
          item:target,node:nodes.get(target.id),
          width:bounds.width,height:bounds.height,
          left:bounds.left-rect.left,top:bounds.top-rect.top,
          startFont:target.fontScale||2.1,startFontPx:Number.isFinite(target.fontSize)?target.fontSize:(target.fontScale||2.1)*11.6,startWidth:target.w
        };
      });
      const groupBounds=resizingGroup?entries.reduce((box,entry)=>({
        left:Math.min(box.left,entry.left),right:Math.max(box.right,entry.left+entry.width)
      }),{left:Infinity,right:-Infinity}):null;
      const groupWidth=resizingGroup?Math.max(1,groupBounds.right-groupBounds.left):0;
      let raf=0,lastX=startX,lastFreeMove=event.ctrlKey;
      const nextValues=new Map();
      const snap=(pixels,min,max,freeMove)=>{
        if(freeMove)return clamp(pixels,min,max);
        const low=Math.ceil(min/gridSize)*gridSize,high=Math.floor(max/gridSize)*gridSize;
        return clamp(Math.round(pixels/gridSize)*gridSize,low,Math.max(low,high));
      };
      const draw=(clientX,freeMove=false)=>{
        const dx=clientX-startX;
        const groupFactor=resizingGroup
          ?snap(groupWidth+dx,Math.max(gridSize,groupWidth*.1),Math.max(gridSize,groupWidth*4),freeMove)/groupWidth
          :1;
        for(const entry of entries){
          if(isText){
            const sizePixels=snap(entry.startFontPx+dx*1160/rect.width,16,96,freeMove);
            nextValues.set(entry.item.id,{fontSize:sizePixels});
            entry.node.style.setProperty('--font-scale',sizePixels/11.6);
            continue;
          }
          const minWidth=rect.width*.05,maxWidth=rect.width;
          const startWidthPixels=resizingGroup?entry.width*groupFactor:entry.width+dx;
          const width=snap(startWidthPixels,minWidth,maxWidth,freeMove);
          const height=entry.height*(width/entry.width);
          const left=clamp(freeMove?entry.left:snap(entry.left,0,Math.max(0,rect.width-width),false),0,Math.max(0,rect.width-width));
          const top=clamp(freeMove?entry.top:snap(entry.top,0,Math.max(0,rect.height-height),false),0,Math.max(0,rect.height-height));
          const x=(left+width/2)/rect.width*100,y=(top+height/2)/rect.height*100,w=width/rect.width*100;
          nextValues.set(entry.item.id,{x,y,w});
          entry.node.style.setProperty('--x',x+'%');
          entry.node.style.setProperty('--y',y+'%');
          entry.node.style.setProperty('--w',w+'%');
        }
      };
      const move=nextEvent=>{
        lastX=nextEvent.clientX;lastFreeMove=nextEvent.ctrlKey;
        if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw(lastX,lastFreeMove)});
      };
      const finish=nextEvent=>{
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',finish);
        if(raf){cancelAnimationFrame(raf);raf=0}
        draw(nextEvent.clientX,nextEvent.ctrlKey);
        for(const entry of entries){
          const value=nextValues.get(entry.item.id);
          if(!value)continue;
          if(isText){entry.item.fontSize=value.fontSize;entry.node.style.setProperty('--font-scale',value.fontSize/11.6)}
          else{
            entry.item.x=value.x;entry.item.y=value.y;entry.item.w=value.w;
            entry.node.style.transform='translate(-50%,-50%)';
            entry.node.style.setProperty('--x',value.x+'%');
            entry.node.style.setProperty('--y',value.y+'%');
            entry.node.style.setProperty('--w',value.w+'%');
          }
        }
        setDirty('Tamanho atualizado. Salve para publicar.');
      };
      window.addEventListener('pointermove',move);window.addEventListener('pointerup',finish,{once:true});window.addEventListener('pointercancel',finish,{once:true});
    }
    function startTextWidthResize(event,item,node){
      const startX=event.clientX,rect=stage.getBoundingClientRect(),bounds=node.getBoundingClientRect(),gridSize=16;
      const startWidth=bounds.width,startLeft=bounds.left-rect.left,startTop=bounds.top-rect.top;
      let raf=0,lastX=startX,lastFreeMove=event.ctrlKey,next=null;
      const snap=(pixels,min,max,freeMove)=>{
        if(freeMove)return clamp(pixels,min,max);
        const low=Math.ceil(min/gridSize)*gridSize,high=Math.floor(max/gridSize)*gridSize;
        return clamp(Math.round(pixels/gridSize)*gridSize,low,Math.max(low,high));
      };
      const draw=(clientX,freeMove=false)=>{
        const width=snap(startWidth+clientX-startX,rect.width*.05,rect.width,freeMove);
        const left=clamp(freeMove?startLeft:snap(startLeft,0,Math.max(0,rect.width-width),false),0,Math.max(0,rect.width-width));
        const top=clamp(freeMove?startTop:snap(startTop,0,rect.height,false),0,rect.height);
        const w=width/rect.width*100;
        node.style.setProperty('--w',w+'%');
        const height=node.getBoundingClientRect().height;
        const x=(left+width/2)/rect.width*100,y=(top+height/2)/rect.height*100;
        node.style.setProperty('--x',x+'%');node.style.setProperty('--y',y+'%');
        next={x,y,w};
      };
      const move=nextEvent=>{
        lastX=nextEvent.clientX;lastFreeMove=nextEvent.ctrlKey;
        if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw(lastX,lastFreeMove)});
      };
      const finish=nextEvent=>{
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',finish);
        if(raf){cancelAnimationFrame(raf);raf=0}
        draw(nextEvent.clientX,nextEvent.ctrlKey);
        if(next){item.x=next.x;item.y=next.y;item.w=next.w;node.style.transform='translate(-50%,-50%)'}
        setDirty('Largura do texto atualizada. Salve para publicar.');
      };
      window.addEventListener('pointermove',move);window.addEventListener('pointerup',finish,{once:true});window.addEventListener('pointercancel',finish,{once:true});
    }
    function refreshUser(session){
      const candidate=session?.user||null;
      const owner=candidate?.email?.toLowerCase()===OWNER_EMAIL;
      user=owner?candidate:null;
      toolbar.classList.toggle('visible',owner);
      login.classList.toggle('visible',!owner);
      stage.classList.toggle('editor-grid',owner);
      $('#hint').textContent=owner?'Solte imagens ou links para adicioná-los ao final. Arraste uma imagem entre os cartões para reorganizar; Shift+clique seleciona vários itens. Dê duplo clique no texto para editar. Segure Ctrl ao redimensionar para sair do grid.':'Entre para editar o portfólio.';
      syncButtons();
      if(!owner&&!elements.length)say('');
    }
    function updateCanvasTabs(){
      stage.classList.toggle('icons-grid',canvasId===1);
      stage.classList.toggle('single-column',canvasId===4||canvasId===5);
      stage.classList.toggle('characters-grid',canvasId===2);
      for(const button of document.querySelectorAll('.canvas-tab')){
        const active=Number(button.dataset.canvasId)===canvasId;
        button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));
      }
    }
    function orderCanvasItems(items){
      const spatial=[...items].sort((a,b)=>(Number(a.y)||0)-(Number(b.y)||0)||(Number(a.x)||0)-(Number(b.x)||0));
      const legacyOrder=new Map(spatial.map((item,index)=>[item.id,index]));
      return spatial.sort((a,b)=>(Number.isFinite(a.gridOrder)?a.gridOrder:legacyOrder.get(a.id))-(Number.isFinite(b.gridOrder)?b.gridOrder:legacyOrder.get(b.id)));
    }
    async function load(){
      const {data,error}=await client.from('studio_canvas').select('elements').eq('id',canvasId).maybeSingle();
      elements=[];extraSpace=0;selectedIds.clear();
      if(!error&&Array.isArray(data?.elements)){
        const space=data.elements.find(item=>item.type==='__canvas_space');
        extraSpace=Number.isFinite(space?.height)?Math.max(0,space.height):0;
        elements=orderCanvasItems(data.elements.filter(item=>item.type!=='__canvas_space'));
      }
      dirty=false;render();syncButtons();
      if(error)say('Não foi possível carregar este portfólio.');else say('');
    }
    let canvasSwitching=false;
    async function switchCanvas(nextId){
      if(nextId===canvasId||canvasSwitching)return;
      canvasSwitching=true;
      if(dirty&&!await saveCanvas()){canvasSwitching=false;return}
      canvasId=nextId;updateCanvasTabs();say('Carregando…');await load();
      canvasSwitching=false;
    }
    for(const button of document.querySelectorAll('.canvas-tab')){
      button.addEventListener('click',()=>switchCanvas(Number(button.dataset.canvasId)));
    }
    $('#signin').addEventListener('click',async()=>{
      const email=$('#email').value.trim().toLowerCase();
      if(email!==OWNER_EMAIL){say('Este e-mail não tem acesso de edição.');return}
      say('Enviando link de acesso…');
      const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:new URL('atelier.html',location.href).href}});
      say(error?error.message:'Confira seu e-mail para entrar.');
    });
    async function makePreview(file){
      if(!file.type.startsWith('image/')||/image\/(gif|svg\+xml)/i.test(file.type))return file;
      let bitmap;
      try{bitmap=await createImageBitmap(file)}catch{return file}
      try{
        const maxDimension=1600,scale=Math.min(1,maxDimension/Math.max(bitmap.width,bitmap.height));
        if(scale===1&&file.size<350000)return file;
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
        const context=canvas.getContext('2d',{alpha:true});
        if(!context)return file;
        context.drawImage(bitmap,0,0,canvas.width,canvas.height);
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.82));
        if(!blob||blob.size>=file.size*.92)return file;
        return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp'});
      }finally{bitmap.close?.()}
    }
    async function uploadImages(inputFiles){
      if(!user){say('Entre antes de adicionar imagens.');return}
      const files=[...inputFiles].filter(file=>file&&file.type.startsWith('image/'));
      if(!files.length){say('Arraste arquivos de imagem para a prévia.');return}
      say('Preparando '+files.length+' imagem(ns)…');
      const results=new Array(files.length);let next=0;
      async function worker(){
        while(true){
          const index=next++;if(index>=files.length)return;
          const file=files[index],path=crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'-');
          const {error}=await client.storage.from(BUCKET).upload(path,file,{cacheControl:'31536000',upsert:false});
          if(error){results[index]={error};continue}
          const publicUrl=client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
          let previewUrl=publicUrl;
          const preview=await makePreview(file);
          if(preview!==file){
            const previewPath=crypto.randomUUID()+'.webp';
            const {error:previewError}=await client.storage.from(BUCKET).upload(previewPath,preview,{cacheControl:'31536000',upsert:false,contentType:'image/webp'});
            if(!previewError)previewUrl=client.storage.from(BUCKET).getPublicUrl(previewPath).data.publicUrl;
          }
          results[index]={src:publicUrl,previewSrc:previewUrl,alt:file.name.replace(/\.[^.]+$/,'')}
        }
      }
      await Promise.all(Array.from({length:Math.min(3,files.length)},worker));
      let topZ=Math.max(0,...elements.map(item=>Number(item.z)||0)),nextGridOrder=Math.max(-1,...elements.map((item,index)=>Number.isFinite(item.gridOrder)?item.gridOrder:index)),added=0,failed=0;
      for(const result of results){
        if(!result||result.error){failed++;continue}
        const item={id:crypto.randomUUID(),type:'image',src:result.src,previewSrc:result.previewSrc||result.src,alt:result.alt,x:50,y:50,w:100,z:++topZ,gridOrder:++nextGridOrder};
        elements.push(item);selectedIds.add(item.id);stage.insertBefore(createPiece(item),selectionBox);added++;
      }
      if(added)setDirty(added+' imagem(ns) adicionada(s) ao final. Salve para publicar.'+(failed?' '+failed+' falhou/falharam.':''));
      else say('Não foi possível enviar as imagens selecionadas.');
      syncSelection();
    }
    async function uploadImageUrl(value){
      try{
        const source=new URL(value);
        if(source.protocol!=='https:')throw new Error('URL inválida');
        const response=await fetch(source.href,{mode:'cors'});
        if(!response.ok)throw new Error('download indisponível');
        const blob=await response.blob();
        if(!blob.type.startsWith('image/'))throw new Error('conteúdo não é imagem');
        const rawName=decodeURIComponent(source.pathname.split('/').pop()||'');
        const name=rawName.includes('.')?rawName:'imagem.'+(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
        await uploadImages([new File([blob],name,{type:blob.type})]);
      }catch{
        say('Esse site não permite copiar a imagem direto. Baixe o arquivo e arraste-o para a prévia.');
      }
    }
    $('#image-input').addEventListener('change',async event=>{
      const files=[...event.target.files];event.target.value='';await uploadImages(files);
    });
    let dragDepth=0;
    function hasImageTransfer(event){
      const types=Array.from(event.dataTransfer?.types||[]);
      return types.includes('Files')||types.includes('text/uri-list')||types.includes('text/x-moz-url')||types.includes('text/html')||types.includes('text/plain');
    }
    function getDroppedImageUrl(transfer){
      const candidates=[
        ...transfer.getData('text/uri-list').split(/\r?\n/),
        transfer.getData('text/x-moz-url').split(/\r?\n/)[0],
        ...transfer.getData('text/plain').split(/\r?\n/)
      ];
      const html=transfer.getData('text/html');
      if(html){const image=new DOMParser().parseFromString(html,'text/html').querySelector('img');if(image?.src)candidates.unshift(image.src)}
      for(const value of candidates){
        const candidate=value.trim();if(!candidate||candidate.startsWith('#'))continue;
        try{const url=new URL(candidate);if(url.protocol==='https:')return url.href}catch{}
      }
      return null;
    }
    stage.addEventListener('dragenter',event=>{
      if(!hasImageTransfer(event))return;
      event.preventDefault();dragDepth++;stage.classList.add('drop-active');
    });
    stage.addEventListener('dragover',event=>{
      if(!hasImageTransfer(event))return;
      event.preventDefault();if(event.dataTransfer)event.dataTransfer.dropEffect='copy';
    });
    stage.addEventListener('dragleave',event=>{
      if(!hasImageTransfer(event))return;
      event.preventDefault();dragDepth=Math.max(0,dragDepth-1);
      if(!dragDepth)stage.classList.remove('drop-active');
    });
    stage.addEventListener('drop',async event=>{
      const transfer=event.dataTransfer;
      if(!transfer)return;
      const files=[...transfer.files].filter(file=>file.type.startsWith('image/'));
      const uri=getDroppedImageUrl(transfer);
      if(!files.length&&!uri&&!hasImageTransfer(event))return;
      event.preventDefault();dragDepth=0;stage.classList.remove('drop-active');
      if(files.length){await uploadImages(files);return}
      if(uri){await uploadImageUrl(uri);return}
      say('Arraste arquivos de imagem para a prévia.');
    });
    $('#add-space').addEventListener('click',()=>{
      if(!user)return;
      const oldHeight=stage.getBoundingClientRect().height;
      const positions=elements.map(item=>({item,pixelY:item.y/100*oldHeight}));
      extraSpace+=300;updateStageHeight();
      const newHeight=stage.getBoundingClientRect().height;
      for(const entry of positions){
        entry.item.y=entry.pixelY/newHeight*100;
        const node=nodes.get(entry.item.id);if(node)stylePiece(node,entry.item);
      }
      setDirty('300 px de espaço adicionados. Salve para publicar.');
    });
    $('#add-text').addEventListener('click',()=>{
      if(!user)return;
      const text=prompt('Texto para o portfólio:','Seu texto');
      if(text===null||!text.trim())return;
      const item={id:crypto.randomUUID(),type:'text',text:text.trim(),x:50,y:0,w:34,fontScale:2.1,fontSize:32,z:highestLayer()+1,gridOrder:0};
      elements.unshift(item);elements.forEach((entry,index)=>{entry.gridOrder=index});
      selectedIds=new Set([item.id]);render();
      setDirty('Texto adicionado no topo. Arraste para ajustar sua linha; salve para publicar.');
    });
    $('#edit-text').addEventListener('click',()=>{
      const item=elements.find(entry=>selectedIds.has(entry.id));
      if(!item||item.type!=='text')return;
      const node=nodes.get(item.id);if(node)beginTextEdit(item,node);
    });
    $('#view-image').addEventListener('click',()=>{const item=elements.find(entry=>selectedIds.has(entry.id));if(item?.type==='image')openLightbox(item)});
    function removeSelection(){
      if(!user||!selectedIds.size)return;
      for(const id of selectedIds){nodes.get(id)?.remove();nodes.delete(id)}
      elements=elements.filter(item=>!selectedIds.has(item.id));selectedIds.clear();setDirty('Seleção removida. Salve para publicar.');syncSelection();
    }
    $('#delete').addEventListener('click',removeSelection);
    window.addEventListener('keydown',event=>{
      const target=event.target,editing=target?.isContentEditable||target instanceof HTMLInputElement||target instanceof HTMLTextAreaElement;
      if(!user||editing||!(event.ctrlKey||event.metaKey))return;
      const key=event.key.toLowerCase();
      if(key==='c'){
        const selected=elements.filter(item=>selectedIds.has(item.id)&&item.type==='text');
        if(!selected.length)return;
        copiedTextBoxes=selected.map(item=>({...item}));event.preventDefault();say(selected.length+' caixa(s) de texto copiada(s).');
      }else if(key==='v'&&copiedTextBoxes.length){
        event.preventDefault();
        let z=Math.max(0,...elements.map(item=>Number(item.z)||0)),nextOrder=Math.max(-1,...elements.map((item,index)=>Number.isFinite(item.gridOrder)?item.gridOrder:index));
        const copies=copiedTextBoxes.map(item=>({...item,id:crypto.randomUUID(),z:++z,gridOrder:++nextOrder}));
        elements.push(...copies);elements.forEach((item,index)=>{if(!Number.isFinite(item.gridOrder))item.gridOrder=index});
        selectedIds=new Set(copies.map(item=>item.id));render();
        setDirty(copies.length+' caixa(s) de texto colada(s). Salve para publicar.');
      }
    });
    window.addEventListener('keydown',event=>{
      const target=event.target;
      if(event.key!=='Delete'||target instanceof HTMLInputElement||target instanceof HTMLTextAreaElement||target?.isContentEditable)return;
      if(!user||!selectedIds.size)return;
      event.preventDefault();removeSelection();
    });
    $('#front').addEventListener('click',()=>{
      const chosen=elements.filter(item=>selectedIds.has(item.id)).sort((a,b)=>a.z-b.z);
      let z=Math.max(0,...elements.map(item=>item.z))+1;
      for(const item of chosen){item.z=z++;nodes.get(item.id)?.style.setProperty('--z',item.z)}
      if(chosen.length)setDirty('Camada atualizada. Salve para publicar.');
    });
    $('#backward').addEventListener('click',()=>{
      const chosen=elements.filter(item=>selectedIds.has(item.id)).sort((a,b)=>a.z-b.z);
      let z=Math.min(0,...elements.map(item=>item.z))-chosen.length;
      for(const item of chosen){item.z=z++;nodes.get(item.id)?.style.setProperty('--z',item.z)}
      if(chosen.length)setDirty('Camada atualizada. Salve para publicar.');
    });
    async function saveCanvas(){
      if(!user)return false;
      if(!dirty)return true;
      say('Salvando…');
      const snapshot=[...elements,{id:'__canvas_space',type:'__canvas_space',height:extraSpace,z:0}];
      const {error}=await client.from('studio_canvas').upsert({id:canvasId,elements:snapshot,updated_at:new Date().toISOString()});
      if(error){say(error.message);return false}
      dirty=false;syncButtons();say('Portfólio salvo.');return true;
    }
    $('#save').addEventListener('click',saveCanvas);
    $('#signout').addEventListener('click',async()=>{await client.auth.signOut();say('Sessão encerrada.')});
    document.addEventListener('pointerdown',event=>{
      const active=document.activeElement;
      if(active?.matches('.text-content[contenteditable="true"]')&&!active.contains(event.target))active.blur();
      if(!user||!selectedIds.size||stage.contains(event.target)||toolbar.contains(event.target)||login.contains(event.target))return;
      selectedIds.clear();syncSelection();
    });
    stage.addEventListener('pointerdown',event=>{
      if(event.target!==stage||!user)return;
      const active=document.activeElement;
      if(active?.matches('.text-content[contenteditable="true"]'))active.blur();
      event.preventDefault();
      const startX=event.clientX,startY=event.clientY;
      const stageRect=stage.getBoundingClientRect();
      const keepSelection=event.shiftKey||event.ctrlKey||event.metaKey;
      const baseSelection=keepSelection?new Set(selectedIds):new Set();
      let raf=0,lastX=startX,lastY=startY;
      const draw=(clientX,clientY)=>{
        const left=Math.min(startX,clientX)-stageRect.left;
        const top=Math.min(startY,clientY)-stageRect.top;
        selectionBox.style.left=left+'px';selectionBox.style.top=top+'px';
        selectionBox.style.width=Math.abs(clientX-startX)+'px';selectionBox.style.height=Math.abs(clientY-startY)+'px';
      };
      selectionBox.hidden=false;
      const move=nextEvent=>{
        lastX=nextEvent.clientX;lastY=nextEvent.clientY;
        if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw(lastX,lastY)});
      };
      const finish=nextEvent=>{
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',finish);
        if(raf){cancelAnimationFrame(raf);raf=0}
        draw(nextEvent.clientX,nextEvent.clientY);selectionBox.hidden=true;
        const moved=Math.abs(nextEvent.clientX-startX)+Math.abs(nextEvent.clientY-startY)>4;
        if(!moved){if(!keepSelection)selectedIds.clear();syncSelection();return}
        const left=Math.min(startX,nextEvent.clientX),right=Math.max(startX,nextEvent.clientX);
        const top=Math.min(startY,nextEvent.clientY),bottom=Math.max(startY,nextEvent.clientY);
        selectedIds=baseSelection;
        for(const item of elements){
          const rect=nodes.get(item.id)?.getBoundingClientRect();
          if(rect&&rect.right>=left&&rect.left<=right&&rect.bottom>=top&&rect.top<=bottom)selectedIds.add(item.id);
        }
        syncSelection();
      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',finish,{once:true});
      window.addEventListener('pointercancel',finish,{once:true});
    });
    client.auth.onAuthStateChange((_event,session)=>refreshUser(session));
    const {data:sessionData}=await client.auth.getSession();
    refreshUser(sessionData.session);
    await load();
  </script>
